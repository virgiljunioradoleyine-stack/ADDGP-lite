# ADDGP-Lite configuration
# This is an engineering artifact, not legal advice.
#
# This file is the tool's own configuration, used by `addgp-lite selfcheck`.
# The auditor is audited: a compliance tool that cannot pass its own scan has
# no standing, so this repository ships the config that makes that reproducible.

version: 1
project:
  name: addgp-lite
  profile: indie
  description_file: .addgp/description.md
regions:
  - gh
  - eu
sectors: []
frameworks:
  - owasp-llm-top10
  - nist-ai-rmf
data_residency:
  users_in: []
  data_stored_in: []
models:
  research: { provider: openrouter, id: perplexity/sonar-pro-search }
  security: { provider: openrouter, id: openai/gpt-5.6-sol }
  architect: { provider: openrouter, id: anthropic/claude-opus-5 }
sovereignty:
  level: 1
  keep_comments: false
  tokenise_terms: []
  never_send: []
  verbatim_allowlist: []
budget:
  per_run_usd: { research: 6, security: 10, architect: 10 }
  on_exceed: stop
scan:
  include:
    - "src/**"
    - "scripts/**"
    - "packs/**"
    - "*.json"
    - "*.sh"
  exclude:
    - "**/node_modules/**"
    - "**/generated/**"
    - "tests/fixtures/**"
  max_file_kb: 512
cache:
  ttl_days: { corpus: 30, evidence: 7, adversary: 7 }
ci:
  fail_on: critical
  baseline: .addgp/baseline.json
